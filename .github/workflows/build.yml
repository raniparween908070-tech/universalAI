
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'

    steps:

      # =====================================
      # 1. Checkout GitHub Repository
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================
      # 2. Setup Java JDK 17
      # =====================================

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =====================================
      # 3. Setup Android SDK (FIXED VERSION)
      # =====================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # =====================================
      # 4. Verify Android SDK
      # =====================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version
          adb version

          echo "Android SDK is working."

      # =====================================
      # 5. Install Required SDK Packages
      # =====================================

      - name: Install Required Android Packages
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK packages..."

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Verifying installed packages..."

          sdkmanager --list_installed

          echo "All required SDK packages installed."

      # =====================================
      # 6. Verify Android Licenses
      # =====================================

      - name: Verify Android Licenses
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK licenses..."

          sdkmanager --licenses

          echo "Android licenses verified."

      # =====================================
      # 7. Check Project Files
      # =====================================

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "Checking project structure..."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew file not found!"
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          chmod +x gradlew

          echo "Project files verified."

          java -version
          ./gradlew --version

      # =====================================
      # 8. Check Android Build Configuration
      # =====================================

      - name: Check Gradle Configuration
        shell: bash
        run: |
          set -e

          echo "Checking Gradle configuration..."

          ./gradlew tasks --all --no-daemon

          echo "Gradle configuration verified."

      # =====================================
      # 9. Clean Previous Build
      # =====================================

      - name: Clean Previous Build
        shell: bash
        run: |
          set -e

          echo "Cleaning old build files..."

          ./gradlew clean --no-daemon

          echo "Clean completed."

      # =====================================
      # 10. Build Release APK
      # =====================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Starting Release APK Build"
          echo "================================"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=2

          echo "Release build completed."

      # =====================================
      # 11. Verify APK File
      # =====================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching generated APK..."

          mkdir -p release-apk

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp {} release-apk/ \;

          if [ -z "$(ls -A release-apk)" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo "APK files generated successfully:"

          ls -lh release-apk/

      # =====================================
      # 12. Upload APK to GitHub
      # =====================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # =====================================
      # 13. Build Success Report
      # =====================================

      - name: Build Success Report
        if: success()
        shell: bash
        run: |
          echo "===================================="
          echo "ANDROID APK BUILD SUCCESSFUL"
          echo "===================================="

          echo "Java: 17"
          echo "Android API: 35"
          echo "Build Tools: 35.0.0"

          echo ""
          echo "Generated APK files:"

          ls -lh release-apk/

          echo ""
          echo "Download APK from GitHub Actions Artifacts."

          echo "===================================="

      # =====================================
      # 14. Build Failure Report
      # =====================================

      - name: Build Failure Report
        if: failure()
        shell: bash
        run: |
          echo "===================================="
          echo "ANDROID APK BUILD FAILED"
          echo "===================================="

          echo "Please inspect the failed step."

          echo "Possible reasons:"
          echo "1. Gradle configuration error"
          echo "2. Missing dependencies"
          echo "3. Incorrect Android SDK configuration"
          echo "4. Missing signing configuration"
          echo "5. Source code compilation error"

          echo "===================================="
