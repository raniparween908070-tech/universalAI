
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'

    steps:

      # --------------------------------
      # STEP 1: Checkout Repository
      # --------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------
      # STEP 2: Setup Java JDK 17
      # --------------------------------

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------
      # STEP 3: Setup Android SDK
      # --------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------
      # STEP 4: Accept Android Licenses
      # --------------------------------

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          LICENSE_STATUS=$?
          set -e

          echo "Android SDK license process completed."

      # --------------------------------
      # STEP 5: Install Android SDK Packages
      # --------------------------------

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          sdkmanager --version

          echo "Updating SDK package information..."

          sdkmanager --update

          install_package() {
            PACKAGE="$1"
            SUCCESS=false

            for ATTEMPT in 1 2 3 4 5
            do
              echo "Installing $PACKAGE"
              echo "Attempt: $ATTEMPT of 5"

              if sdkmanager --install "$PACKAGE"; then
                SUCCESS=true
                break
              fi

              echo "Installation failed. Retrying..."
              sleep 10
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: Could not install $PACKAGE"
              exit 1
            fi
          }

          install_package "platform-tools"
          install_package "platforms;android-35"
          install_package "build-tools;35.0.0"

          echo "Verifying Android SDK packages..."

          sdkmanager --list_installed

          echo "Android SDK setup successful!"

      # --------------------------------
      # STEP 6: Configure Environment
      # --------------------------------

      - name: Configure Android Environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          echo "Android environment configured."

      # --------------------------------
      # STEP 7: Check Gradle Project
      # --------------------------------

      - name: Check Gradle Project
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew file not found!"
            echo "This repository must contain a Gradle Android project."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper found."

          java -version
          ./gradlew --version

      # --------------------------------
      # STEP 8: Check Android Modules
      # --------------------------------

      - name: Check Android Modules
        shell: bash
        run: |
          set -e

          echo "Checking available Gradle tasks..."

          ./gradlew tasks --all

      # --------------------------------
      # STEP 9: Clean Previous Build
      # --------------------------------

      - name: Clean Previous Build
        shell: bash
        run: |
          set -e

          ./gradlew --no-daemon clean

          echo "Previous build cleaned."

      # --------------------------------
      # STEP 10: Build Release APK
      # --------------------------------

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Starting Android Release APK build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleRelease

          echo "Release APK build completed."

      # --------------------------------
      # STEP 11: Verify APK
      # --------------------------------

      - name: Verify Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find . -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK generated successfully!"
          echo "Total APK files: $APK_COUNT"

      # --------------------------------
      # STEP 12: Upload APK Artifact
      # --------------------------------

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      # --------------------------------
      # STEP 13: Build Summary
      # --------------------------------

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=================================="
          echo "ANDROID APK BUILD SUCCESSFUL"
          echo "=================================="
          echo ""
          echo "Java Version: 17"
          echo "Android API: 35"
          echo "Build Tools: 35.0.0"
          echo ""
          echo "APK is available in GitHub Actions Artifacts."
          echo ""
          echo "=================================="

      # --------------------------------
      # STEP 14: Failure Information
      # --------------------------------

      - name: Build Failure Information
        if: failure()
        shell: bash
        run: |
          echo "=================================="
          echo "ANDROID APK BUILD FAILED"
          echo "=================================="
          echo ""
          echo "Please check the failed step above."
          echo "Possible issues:"
          echo "1. Android SDK installation"
          echo "2. Gradle configuration"
          echo "3. Missing dependencies"
          echo "4. Android project configuration"
          echo ""
          echo "=================================="
