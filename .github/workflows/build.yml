name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Gradle project kahan hai (root ya subfolder) khud dhoondho
      - name: Detect Android Project Directory
        id: detect
        run: |
          SETTINGS=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Repo mein koi Gradle/Android project nahi mila (settings.gradle missing)."
            echo "Repo ke files:"
            ls -la
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "Android project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      # NOTE: yahan cache: gradle use nahi kiya, wahi error ka kaaran tha
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Accept Android Licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "gradlew nahi mila, system gradle use hoga"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Clean Previous Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ${{ env.GRADLE_CMD }} clean --stacktrace

      # Debug APK: signing key ki zaroorat nahi, isliye ye hamesha install hone layak banti hai
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ${{ env.GRADLE_CMD }} assembleDebug --stacktrace

      # Release APK (unsigned banegi jab tak signing config na ho)
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: ${{ env.GRADLE_CMD }} assembleRelease --stacktrace

      - name: Verify APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -name "*.apk" -type f
          COUNT=$(find "$PROJECT_DIR" -name "*.apk" -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Koi APK nahi bani"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build Success Report
        if: success()
        run: echo "Build successful. Actions ke Artifacts section se APK download karo."

      - name: Build Failure Report
        if: failure()
        run: echo "Build fail hua. Upar ke step ka log dekho."
